<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form with Anti-AI Captcha</title>
  <link rel="stylesheet" href="../captcha-sdk.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .captcha-wrapper {
      margin: 24px 0;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .forgot-password {
      text-align: center;
      margin-top: 16px;
    }

    .forgot-password a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 24px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your account</p>

    <div id="alertContainer"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <div class="captcha-wrapper">
        <div id="captcha-container"></div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        Sign In
      </button>

      <div class="forgot-password">
        <a href="password-recovery.html">Forgot your password?</a>
      </div>
    </form>
  </div>

  <script src="../captcha-sdk.js"></script>
  <script>
    // Initialize captcha
    const captcha = new CaptchaSDK({
      apiKey: 'YOUR_API_KEY_HERE', // Replace with your actual API key
      apiUrl: 'http://localhost:8000', // Replace with your API URL
      difficulty: 'medium',
      theme: 'light',
      onSuccess: function(result) {
        console.log('Captcha verified successfully!', result);
        // Enable submit button
        document.getElementById('submitBtn').disabled = false;
      },
      onError: function(error) {
        console.error('Captcha error:', error);
        showAlert('Captcha verification failed. Please try again.', 'error');
        document.getElementById('submitBtn').disabled = true;
      },
      onExpire: function() {
        console.log('Captcha expired');
        document.getElementById('submitBtn').disabled = true;
      }
    });

    // Render captcha widget
    captcha.render('#captcha-container', {
      difficulty: 'medium',
      collectBehavior: true,
      useProgressive: false
    });

    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const captchaToken = captcha.getToken();

      if (!captchaToken) {
        showAlert('Please complete the captcha first.', 'error');
        return;
      }

      // Show loading state
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.textContent = 'Signing in...';
      submitBtn.disabled = true;

      try {
        // Send login request to your backend
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: password,
            captcha_token: captchaToken,
            captcha_id: captcha.getCaptchaId()
          })
        });

        const result = await response.json();

        if (result.success) {
          showAlert('Login successful! Redirecting...', 'success');
          // Redirect to dashboard or home page
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1500);
        } else {
          showAlert(result.message || 'Login failed. Please try again.', 'error');
          // Reset captcha on failure
          captcha.reset();
          submitBtn.textContent = 'Sign In';
        }

      } catch (error) {
        console.error('Login error:', error);
        showAlert('An error occurred. Please try again.', 'error');
        captcha.reset();
        submitBtn.textContent = 'Sign In';
      }
    });

    // Show alert message
    function showAlert(message, type) {
      const container = document.getElementById('alertContainer');
      container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

      // Clear after 5 seconds
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    // Reset submit button when captcha is reset
    setInterval(() => {
      if (!captcha.getToken()) {
        document.getElementById('submitBtn').disabled = true;
      }
    }, 1000);
  </script>
</body>
</html>
